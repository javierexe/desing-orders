services:
  - type: web
    name: design-orders-backend
    env: python
    region: oregon
    plan: free
    branch: develop
    buildCommand: |
      # Instalar dependencias del sistema
      apt-get update
      apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
      apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
      
      # Instalar dependencias de Python
      cd backend
      pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.4"